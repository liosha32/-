<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Дэпай</title>
<style>
:root{color-scheme:dark;--btn:rgb(70,130,180);--panel:rgb(50,50,80);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
button,.card,.p{user-select:none;-webkit-user-select:none}
html,body{margin:0;min-height:100%;background:#1e1e32;color:#dcdcdc;font:16px/1.3 system-ui,"Segoe UI",Roboto,Arial,sans-serif}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}

.p,.b,.card{image-rendering:pixelated;text-shadow:0 1px 3px #000}
.p{background:var(--panel);border:2px solid #ffffff30;border-radius:14px;padding:12px;text-align:center}
.b{background:var(--btn);border:2px solid #ffffff40;border-radius:12px;color:#fff;font:600 17px system-ui,Arial;padding:12px;touch-action:manipulation}
.b:active{filter:brightness(1.35)}
.b.s{padding:8px 6px;font-size:14px}.b.g{background:#555}.b.r{background:#a33}.b.k{background:#3a8a3a}
.row{display:flex;gap:8px}.row>*{flex:1}
.dice{display:flex;justify-content:space-around}
.d{width:72px;height:72px;border-radius:50%;background:#282846;border:3px solid #6464a0;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700}
.win{background:#064a06!important}.lose{background:#4a0606!important}
.big{font-size:26px;font-weight:700}
.ov{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.ov .p{width:100%;max-width:380px;background:#3c3c64;display:flex;flex-direction:column;gap:10px}
input{font-size:18px;padding:10px;border-radius:8px;border:2px solid #000;user-select:text!important;-webkit-user-select:text!important;width:100%;text-align:center;letter-spacing:2px}
.kp{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}.kk{padding:9px 0;font-size:14px;border-radius:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}.tabs .b{flex:0 0 auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{border:2px solid #ffffff40;border-radius:12px;overflow:hidden;background:#282846;display:flex;flex-direction:column;touch-action:manipulation}
.card i{height:70px;display:block;image-rendering:pixelated}
.card div{padding:6px 8px;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000d;border:2px solid #999;border-radius:10px;padding:10px 16px;z-index:9;max-width:90%;text-align:center}
.cw{position:relative;width:100%;aspect-ratio:1;border:4px solid #3c3c50}
.cw canvas{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}
.cw::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#0003 1px,transparent 1px),linear-gradient(90deg,#0003 1px,transparent 1px);background-size:calc(100%/32) calc(100%/32)}
.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.sw{aspect-ratio:1;border:3px solid #505064;border-radius:6px}.sw.on{border-color:#ff0}
.pl{display:flex;justify-content:space-between;padding:6px 10px;border-radius:6px;margin-bottom:4px;font-size:14px}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),T=()=>Date.now()/1000,f=n=>"$"+Math.round(n).toLocaleString("en-US"),R=Math.random,ri=n=>~~(R()*n);
const RAR={common:["#969696","Обычный"],rare:["#00c800","Редкий"],epic:["#b400ff","Эпический"],legendary:["#ffc800","Легендарный"],mythic:["#ff2222","Мифический"]};
const mk=a=>Object.fromEntries(a.map(([n,c,r,p,a])=>[n,{c,r,p,a}]));
const ITEMS={
bg:mk([["Темный",[30,30,50],"common",0],["Зеленый",[30,50,30],"common",5e4],["Красный",[50,30,30],"common",5e4],["Синий",[30,30,70],"common",5e4],["Фиолетовый",[50,30,50],"rare",15e4],["Черный",[20,20,20],"rare",15e4],["Серый",[50,50,50],"common",75e3],["Коричневый",[50,40,30],"common",75e3],["Оранжевый",[50,40,20],"rare",2e5],["Розовый",[50,30,40],"rare",2e5],["Бирюзовый",[30,50,50],"epic",4e5],["Золотой",[50,45,20],"legendary",1e6,"g"],["Неоновый",[255,0,255],"mythic",25e5,"n"],["Радужный",[255,100,100],"legendary",5e6,"w"],["Океан",[0,50,100],"epic",5e5,"b"],["Лес",[0,80,0],"rare",25e4,"l"],["Космос",[10,10,40],"epic",6e5,"t"],["Лава",[100,30,0],"epic",6e5,"f"],["Лед",[100,150,200],"epic",6e5,"s"]]),
bt:mk([["Стандартный",[70,130,180],"common",0],["Зеленый",[50,150,50],"common",5e4],["Красный",[180,50,50],"common",5e4],["Золотой",[200,170,50],"legendary",1e6],["Фиолетовый",[130,50,180],"epic",25e4],["Неоновый",[0,255,255],"mythic",1e6],["Огонь",[255,100,0],"mythic",15e5]]),
pn:mk([["Стандартный",[50,50,80],"common",0],["Зеленый",[40,70,40],"common",5e4],["Красный",[70,40,40],"common",5e4],["Золотой",[70,60,30],"legendary",1e6],["Неоновый",[0,255,0],"mythic",1e6],["Хрусталь",[150,200,255],"legendary",4e5],["Божественный",[255,255,255],"mythic",1e9]])};
const CATN={bg:"Фоны",bt:"Кнопки",pn:"Панели"};
const PROMO={"123":100,"456":200,"789":300,"111":500,"222":1000,"333":1500,"444":2000,"555":2500,"666":3000,"777":3500,"888":4000,"999":4500,"000":5000,MONEY:1e4,CASH:15e3,GOLD:2e4,RICH:25e3,WIN:3e4,LUCK:35e3,STAR:4e4,KING:45e3,BOSS:5e4,TOP:55e3,PRO:6e4,GOD:65e3,BONUS100:1e5,BONUS200:15e4,BONUS300:2e5,BONUS400:25e4,BONUS500:3e5,MILLION1:1e6,MILLION2:15e5,MILLION3:2e6,"221188":1e6,"06032012":1e6,DEPAI:1e6,SUPER:1e6,MEGA:1e6,ULTRA:1e6,LEGEND:1e6,MYTH:1e6,EPIC:1e6,RARE:1e6};
let S={bal:1000,debt:0,dp:.05,days:1,admin:0,bg:"Темный",bt:"Стандартный",pn:"Стандартный",owned:["bg:Темный","bt:Стандартный","pn:Стандартный"],used:[],pred:0,pr:null,tB:0,tP:0,tC:0,tG:0,skins:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem("depai")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("depai",JSON.stringify(S))}catch(e){}};
if(!S.v1){S.bal=1000;S.v1=1;save()}
S.skins.forEach(k=>ITEMS[k.t][k.n]={c:k.c,r:"mythic",p:0,img:k.d});
["bg","bt","pn"].forEach(k=>{if(!ITEMS[k][S[k]])S[k]=k=="bt"||k=="pn"?"Стандартный":"Темный"});
let bet=100,st="bet",res=[0,0,0],win=0,hl=null,scr="main",modal=null,cat="bg",fl="all",free=false,L=[],cgGot=0,cgStop=null;
const fill=o=>o.img?`url(${o.img}) center/100% 100%`:`rgb(${o.c})`;
function apply(){const b=ITEMS.bg[S.bg],r=document.documentElement,s=r.style;
 s.background=b.img?`url(${b.img}) 0 0/192px`:`rgb(${b.c})`;s.imageRendering="pixelated";
 s.setProperty("--btn",fill(ITEMS.bt[S.bt]));s.setProperty("--panel",fill(ITEMS.pn[S.pn]))}
function toast(t){let e=$("#toast");if(!e){e=document.createElement("div");e.id="toast";document.body.appendChild(e)}e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2600)}
/* ---- фоновые частицы ---- */
const cv=$("#fx"),cx=cv.getContext("2d");let P=[];
const rs=()=>{cv.width=innerWidth;cv.height=innerHeight};rs();addEventListener("resize",rs);
function fx(){const a=ITEMS.bg[S.bg].a,W=cv.width,H=cv.height,x=R()*W,y=R()*H;
 const sp={s:[.2,{t:"s",x,y:0,v:1+R()*4}],t:[.05,{t:"t",x,y,k:60}],b:[.05,{t:"b",x,y:H,v:1+R()}],f:[.15,{t:"f",x,y:H,v:2+R()*3}],l:[.05,{t:"l",x,y:0,v:1+R()}],g:[.1,{t:"g",x,y,k:30}],n:[.2,{t:"n",x,y,k:20}],w:[.3,{t:"w",x,y,k:15}]}[a];
 if(sp&&R()<sp[0])P.push(sp[1]);
 cx.clearRect(0,0,W,H);
 P=P.filter(p=>{
  if(p.t=="s"||p.t=="l"){p.y+=p.v;p.x+=Math.sin(p.y*.04)*2}else if(p.t=="b"||p.t=="f")p.y-=p.v;else p.k--;
  const col={s:"#fff",l:"#0a0",b:"#9cf",f:["#f60","#f90","#fc0"][ri(3)],g:"#ffd700",n:["#f0f","#0ff","#ff0"][ri(3)],w:"#"+ri(16777215).toString(16).padStart(6,"0"),t:"#fff"}[p.t];
  cx.fillStyle=cx.strokeStyle=col;cx.beginPath();cx.arc(p.x,p.y,{s:3,l:4,b:5,f:4,g:3,n:2,w:2,t:2}[p.t],0,7);p.t=="b"?cx.stroke():cx.fill();
  return p.k===undefined?(p.y>-10&&p.y<H+10):p.k>0});
 requestAnimationFrame(fx)}
/* ---- главный экран ---- */
function render(){({main,shop,draw:drawScr,admin,plist})[scr]()}
function main(){
 const cd=S.admin?0:Math.max(0,3600-(T()-S.tC)),gift=T()-S.tG>=86400,busy=st!="bet",show=st=="show";
 const dv=busy&&!show?[1,1,1]:res;
 $("#app").innerHTML=`
 <div class="p big">Баланс: ${f(S.bal)}</div>
 ${S.debt>0?`<div class="p" style="background:#c89632;color:#222;text-shadow:none;font-weight:700">Долг: ${f(S.debt)} (${S.dp>0?"5% за спин":"20% сразу"})</div>`:""}
 <div class="p big" id="bet">Ставка: ${f(bet)}</div>
 <div class="p"><div class="dice">${[0,1,2].map(i=>`<div class="d" id="d${i}">${st=="bet"&&!res[0]?"?":dv[i]}</div>`).join("")}</div>
 ${S.pr?`<div style="margin-top:8px;font-size:14px">Предсказание: ${S.pr.join(" ")}</div>`:""}</div>
 ${show?`<div class="p ${win>0?"win":"lose"} big" style="color:${win>0?"#4c4":"#e55"}">${win>0?"Выигрыш: "+f(win):"Проигрыш: "+f(bet)}</div>`:""}
 <div class="row"><button class="b" id="dec">−</button><button class="b" onclick="setBet(0)">Сброс</button><button class="b" id="inc">+</button></div>
 <button class="b" onclick="setBet(1)">Макс</button>
 <button class="b" style="font-size:24px;padding:18px;${hl=="win"?"background:#0c0":hl=="lose"?"background:#c00":""}" onclick="spin()" ${busy?"disabled":""}>Крутить!</button>
 ${S.debt>0?`<button class="b" onclick="repay()">Погасить долг</button>`:""}
 <div class="row"><button class="b s" onclick="coin()">${cd>0?"Ждите "+~~(cd/60)+":"+String(~~cd%60).padStart(2,"0"):"Заработать"}</button><button class="b s" onclick="modal='promo';main()">Промокод</button><button class="b s" onclick="openShop(0)">Магазин</button></div>
 ${gift?`<button class="b" style="background:#c8b432" onclick="claimGift()">🎁 Подарок</button>`:""}
 ${S.admin?`<button class="b g" onclick="scr='admin';render()">АДМИН</button>`:""}
 <div style="color:#ff0;font-size:18px">Дней: ${S.days}</div>
 <button class="b s g" onclick="modal='reset';main()">↺ Начать заново</button>
 ${modal=="loan"?`<div class="ov"><div class="p"><div class="big" style="color:#ffdc64">КРЕДИТ</div><div>${S.bal>0?"Баланс: "+f(S.bal):"Нужен кредит!"}</div><div class="row"><button class="b s" onclick="loan(1)">5% за спин</button><button class="b s" onclick="loan(2)">20% сразу</button></div>${S.debt>0?`<button class="b s g" onclick="modal=null;main()">Отказаться</button>`:""}</div></div>`:""}
 ${modal=="promo"?`<div class="ov"><div class="p"><div>Введите промокод:</div><input id="pi" inputmode="none" autocomplete="off" autocapitalize="characters" placeholder="код"><div class="kp">${"1234567890QWERTYUIOPASDFGHJKLZXCVBNM".split("").map(k=>`<button class="b kk" onclick="kp('${k}')">${k}</button>`).join("")}<button class="b kk r" onclick="kp('')">⌫</button></div><div class="row"><button class="b k" onclick="promo()">ОК</button><button class="b g" onclick="modal=null;main()">Отмена</button></div></div></div>`:""}
 ${modal=="reset"?`<div class="ov"><div class="p"><div class="big" style="color:#f66">Начать заново?</div><div>Баланс станет $1,000. Долг, покупки, рисунки и промокоды тоже сбросятся.</div><div class="row"><button class="b r" onclick="resetAll()">Сбросить</button><button class="b g" onclick="modal=null;main()">Отмена</button></div></div></div>`:""}`;
 hold($("#inc"),1);hold($("#dec"),-1);
 const pi=$("#pi");if(pi){pi.focus();pi.onkeydown=e=>e.key=="Enter"&&promo()}
}
function hold(el,d){if(!el)return;let t,i;const stop=()=>{clearTimeout(t);clearInterval(i)};
 el.onpointerdown=e=>{e.preventDefault();step(d);t=setTimeout(()=>i=setInterval(()=>step(d),100),500)};
 el.onpointerup=el.onpointerleave=el.onpointercancel=stop}
function step(d){if(st!="bet"||S.bal<=0)return;if(d>0){bet=S.bal>=bet+50?bet+50:~~S.bal}else if(bet>50)bet-=50;$("#bet").textContent="Ставка: "+f(bet)}
function setBet(m){if(st!="bet")return;bet=m?~~S.bal:(S.bal>=100?100:~~S.bal);$("#bet").textContent="Ставка: "+f(bet)}
function spin(){
 if(st!="bet")return;if(S.bal<=0){modal="loan";main();return}
 if(S.bal<bet)bet=~~S.bal;S.bal-=bet;st="roll";hl=null;
 if(S.pr){res=[...S.pr];S.pr=null;S.tP=T();save()}else res=[0,0,0].map(()=>1+ri(6));
 main();let k=0;
 const iv=setInterval(()=>{k++;for(let i=0;i<3;i++){const e=$("#d"+i);if(e)e.textContent=k>=(i+1)*6?res[i]:1+ri(6)}if(k>=18){clearInterval(iv);finish()}},70)}
function finish(){
 const[a,b,c]=res;win=a==b&&b==c?bet*(a==6?10:5):new Set(res).size==2?bet*2:0;
 if(win>0){S.bal+=win;hl="win"}else hl="lose";
 if(S.debt>0&&S.dp>0){const x=S.debt*S.dp;S.debt+=x;S.bal=Math.max(0,S.bal-x)}
 save();st="show";if(scr=="main")main();
 setTimeout(()=>{st="bet";hl=null;if(S.bal<=0)modal="loan";if(scr=="main")main()},1200)}
function loan(t){S.bal+=500;if(t==1){S.debt+=500;S.dp=.05}else{S.debt+=600;S.dp=0}modal=null;bet=S.bal>=100?100:~~S.bal;save();main()}
function repay(){if(S.bal>0&&S.debt>0){if(S.bal>=S.debt){S.bal-=S.debt;S.debt=0}else{S.debt-=S.bal;S.bal=0}save();if(S.bal<=0)modal="loan";main()}}
function claimGift(){let t;if(R()<.5){const a=10000+ri(90001);S.bal+=a;t="+"+f(a)}else{const a=[1e5,5e5,1e6][ri(3)];S.bal+=a;t="Бонус +"+f(a)}S.tG=T();save();toast("🎁 "+t);main()}
function resetAll(){try{localStorage.removeItem("depai")}catch(e){}location.reload()}
function kp(k){const i=$("#pi");i.value=k?i.value+k:i.value.slice(0,-1)}
function promo(){
 const LM={"Й":"Q","Ц":"W","У":"E","К":"R","Е":"T","Н":"Y","Г":"U","Ш":"I","Щ":"O","З":"P","Ф":"A","Ы":"S","В":"D","А":"F","П":"G","Р":"H","О":"J","Л":"K","Д":"L","Я":"Z","Ч":"X","С":"C","М":"V","И":"B","Т":"N","Ь":"M"};
 const c=$("#pi").value.trim().toUpperCase().replace(/[А-ЯЁ]/g,x=>LM[x]||x).replace(/\s+/g,"");modal=null;
 if(c=="ADMIN123"){S.admin=S.admin?0:1;toast(S.admin?"Админ ВКЛ!":"Админ ВЫКЛ!")}
 else if(S.used.includes(c))toast("Уже использован!");
 else if(PROMO[c]){S.bal+=PROMO[c];S.used.push(c);toast("+"+f(PROMO[c]))}
 else toast("Неверный код!");
 save();main()}
/* ---- игра «Заработать» ---- */
function coin(){
 if(!S.admin&&T()-S.tC<3600)return;
 S.tC=T();save();scr="coin";cgGot=0;
 $("#app").innerHTML=`<canvas id="cg" style="position:fixed;inset:0;width:100%;height:100%;background:#283c5a;touch-action:none"></canvas><button class="b" style="position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px))" onclick="endCoin()">Забрать</button>`;
 const c=$("#cg");c.width=innerWidth;c.height=innerHeight;const g=c.getContext("2d"),W=c.width,H=c.height,s=H/800,bw=Math.max(100,W*.28),bh=60*s+20;
 let bx=W/2,cs=[],left=45,last=performance.now(),sp=0,on=true;
 c.onpointermove=c.onpointerdown=e=>{bx=Math.max(bw/2,Math.min(W-bw/2,e.clientX))};
 const TY={n:{c:"#ffd700",v:50,w:60,r:15},s:{c:"#c0c0c0",v:100,w:25,r:12},d:{c:"#00ffff",v:500,w:15,r:18}};
 cgStop=()=>on=false;
 const loop=now=>{if(!on)return;const dt=Math.min(.05,(now-last)/1000);last=now;left-=dt;sp+=dt;
  if(sp>=.2){sp=0;let q=R()*100,k=q<60?"n":q<85?"s":"d";cs.push({x:20+R()*(W-40),y:0,k,r:TY[k].r*Math.max(.8,s),v:(5+R()*3)*60*s,a:R()*360})}
  g.clearRect(0,0,W,H);
  cs=cs.filter(o=>{o.y+=o.v*dt;o.a+=300*dt;
   if(o.y+o.r>=H-bh&&Math.abs(o.x-bx)<=bw/2){cgGot+=TY[o.k].v;return false}
   if(o.y>H)return false;
   const wf=Math.abs(Math.cos(o.a*Math.PI/180));g.fillStyle=TY[o.k].c;g.strokeStyle="#0006";g.lineWidth=3;
   g.beginPath();g.ellipse(o.x,o.y,Math.max(3,o.r*wf),o.r,0,0,7);g.fill();g.stroke();return true});
  g.fillStyle="#964b00";g.strokeStyle="#643200";g.lineWidth=3;g.beginPath();g.moveTo(bx-bw/2,H-bh);g.lineTo(bx+bw/2,H-bh);g.lineTo(bx+bw/3,H);g.lineTo(bx-bw/3,H);g.closePath();g.fill();g.stroke();
  g.font="700 22px system-ui";g.fillStyle="#fff";g.textAlign="left";g.fillText("Время: "+Math.max(0,~~left)+" сек",14,34+0);
  g.fillStyle="#ffd700";g.textAlign="center";g.fillText("Заработано: "+f(cgGot),W/2,68);
  if(left<=0)return endCoin();requestAnimationFrame(loop)};
 requestAnimationFrame(loop)}
function endCoin(){if(cgStop)cgStop();cgStop=null;S.bal+=cgGot;S.days++;save();scr="main";st="bet";main()}
/* ---- магазин ---- */
function openShop(fr){free=!!fr;scr="shop";cat="bg";fl="all";render()}
function shop(){
 L=Object.entries(ITEMS[cat]).filter(([n,o])=>fl=="all"||o.r==fl);
 $("#app").innerHTML=`<div class="p big" style="color:${free?"#f66":"#ffc864"}">${free?"АДМИН-МАГАЗИН":"МАГАЗИН"}</div>
 <div class="p">Баланс: ${f(S.bal)}${free?" · всё бесплатно":""}</div>
 <div class="tabs">${Object.keys(CATN).map(k=>`<button class="b s ${k==cat?"":"g"}" onclick="cat='${k}';render()">${CATN[k]}</button>`).join("")}</div>
 <div class="tabs">${["all","common","rare","epic","legendary","mythic"].map((r,i)=>`<button class="b s ${r==fl?"":"g"}" onclick="fl='${r}';render()">${["Все","Обычн.","Редк.","Эпич.","Легенд.","Миф."][i]}</button>`).join("")}</div>

 <div class="grid">${L.map(([n,o],i)=>{const ow=S.owned.includes(cat+":"+n),sel=S[cat]==n;return `<div class="card" onclick="pick(${i})"><i style="background:${fill(o)}"></i><div><b>${n}</b><br><span style="color:${RAR[o.r][0]}">${RAR[o.r][1]}</span><br>${ow?(sel?"✓ ВЫБРАНО":"КУПЛЕНО"):f(o.p)}</div></div>`}).join("")}</div>
 <button class="b" onclick="scr='${free?"admin":"main"}';free=false;render()">Назад</button>`}
function pick(i){const[n,o]=L[i],k=cat+":"+n;
 if(!S.owned.includes(k)){if(!free&&S.bal<o.p){toast(`Нужно ${f(o.p)}, у вас ${f(S.bal)}`);return}
  if(!free)S.bal-=o.p;S.owned.push(k);toast(free?`✓ Куплен «${n}» (бесплатно)`:`✓ Куплен «${n}» за ${f(o.p)}`)}
 else if(S[cat]!=n)toast(`Выбран «${n}»`);
 S[cat]=n;save();apply();shop()}
/* ---- редактор рисунка ---- */
const PAL=["#000000","#ffffff","#808080","#c0c0c0","#ff0000","#c80000","#ff8000","#ffc800","#ffff00","#80ff00","#00ff00","#00c800","#00ff80","#00ffff","#0080ff","#0000ff","#6400ff","#c800ff","#ff00c8","#ff0064","#964b00","#643200","#8b4513","#d2b48c"];
let dc="#000000",dt="brush",dty="bg",dg;
function draw(t){dty=t;dc="#000000";dt="brush";scr="draw";render()}
function drawScr(){
 $("#app").innerHTML=`<div class="p big" style="color:#ffc864">🎨 Редактор: ${CATN[dty].toLowerCase()}</div>
 <div class="cw"><canvas id="dc" width="32" height="32"></canvas></div>
 <div class="pal">${PAL.map(c=>`<div class="sw ${c==dc?"on":""}" style="background:${c}" onclick="dc='${c}';dt='brush';mark()"></div>`).join("")}</div>
 <div class="row"><button class="b s" onclick="dt='brush'">🖌 Кисть</button><button class="b s" onclick="dt='eraser'">🧹 Ластик</button><button class="b s" onclick="dt='fill'">🪣 Залить</button><button class="b s" onclick="clr()">✕ Очистить</button></div>
 <div class="row"><button class="b k" onclick="saveDraw()">💾 Сохранить</button><button class="b g" onclick="scr='shop';render()">← Отмена</button></div>`;
 const c=$("#dc");dg=c.getContext("2d");clr();let dn=0;
 const pt=e=>{const r=c.getBoundingClientRect(),x=ri((e.clientX-r.left)/r.width*32),y=ri((e.clientY-r.top)/r.height*32);
  if(dt=="fill"){dg.fillStyle=dc;dg.fillRect(0,0,32,32)}else{dg.fillStyle=dt=="eraser"?"#fff":dc;dg.fillRect(x,y,1,1)}};
 c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);dn=1;pt(e)};c.onpointermove=e=>dn&&pt(e);c.onpointerup=c.onpointercancel=()=>dn=0}
function mark(){document.querySelectorAll(".sw").forEach((e,i)=>e.classList.toggle("on",PAL[i]==dc))}
function clr(){dg.fillStyle="#fff";dg.fillRect(0,0,32,32)}
function saveDraw(){
 const n="Рисунок #"+(1000+ri(9000)),d=dg.canvas.toDataURL(),id=dg.getImageData(0,0,32,32).data;let r=0,g=0,b=0;
 for(let i=0;i<id.length;i+=4){r+=id[i];g+=id[i+1];b+=id[i+2]}
 const c=[~~(r/1024),~~(g/1024),~~(b/1024)];
 ITEMS[dty][n]={c,r:"mythic",p:0,img:d};S.skins.push({t:dty,n,c,d});S.owned.push(dty+":"+n);S[dty]=n;
 save();apply();cat=dty;scr="shop";toast("✓ Создан «"+n+"»");render()}
/* ---- админка ---- */
function admin(){
 $("#app").innerHTML=`<div class="p big" style="color:#f66">АДМИН-ПАНЕЛЬ</div><div class="p">Баланс: ${f(S.bal)} · Долг: ${f(S.debt)}</div>
 <button class="b" onclick="aBonus()">Бонус $3,000,000</button>
 <button class="b" onclick="aDebt()">Очистить долг</button>
 <button class="b" onclick="aPred()">Предсказание: ${S.pred?"ВКЛ":"ВЫКЛ"}</button>
 <button class="b" onclick="openShop(1)">Магазин: всё бесплатно</button>
 <button class="b" onclick="S.bal+=5e7;save();admin()">+50,000,000</button>
 <button class="b" style="background:#643c96" onclick="scr='plist';render()">📋 Все промокоды</button>
 <button class="b g" onclick="scr='main';render()">Назад</button>`}
function aBonus(){const r=86400-(T()-S.tB);if(r<=0){S.bal+=3e6;S.tB=T();save();toast("Получено $3,000,000!")}else toast(`Подожди ${~~(r/3600)}ч ${~~(r%3600/60)}м`);admin()}
function aDebt(){if(S.debt>0){S.bal=Math.max(0,S.bal-S.debt);S.debt=0;save()}admin()}
function aPred(){
 if(S.pred){if(!S.pr)S.pred=0}
 else if(T()-S.tP>=300){S.pred=1;S.pr=[0,0,0].map(()=>1+ri(6));toast("Предсказание: "+S.pr.join(" "))}
 else toast(`Подожди ${Math.ceil((300-(T()-S.tP))/60)} мин`);
 save();admin()}
function plist(){
 const a=Object.entries(PROMO).sort((x,y)=>y[1]-x[1]);
 $("#app").innerHTML=`<div class="p big" style="color:#ffc864">📋 Промокоды</div><div class="p">Всего: ${a.length} · Использовано: ${S.used.length}</div>
 <div>${a.map(([c,v])=>{const u=S.used.includes(c);return `<div class="pl" style="background:${u?"#3c2828":"#283c28"};color:${u?"#c88":"#9d9"}"><span>${c}</span><span style="color:#ffdc64">${f(v)}</span><span>${u?"✗":"✓"}</span></div>`}).join("")}</div>
 <button class="b" onclick="scr='admin';render()">Назад</button>`}
/* ---- старт ---- */
apply();fx();
if(S.bal<=0)modal="loan";
main();
setInterval(()=>{if(scr=="main"&&st=="bet"&&!modal&&!document.activeElement.matches("input")&&!S.admin)main()},30000);
</script>
</body>
